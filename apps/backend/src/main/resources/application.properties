quarkus.application.name=restaurante-marketplace-backend

# PostgreSQL e migrações
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Endpoints operacionais ficam separados da API pública.
quarkus.management.enabled=true
quarkus.management.port=9000
# Evita conflito entre a suíte e uma instância local em execução.
%test.quarkus.http.test-port=0
%test.quarkus.management.test-port=0

# Proteções iniciais para consultas GraphQL.
quarkus.smallrye-graphql.instrumentation-query-depth=15
quarkus.smallrye-graphql.instrumentation-query-complexity=200
quarkus.smallrye-graphql.error-extension-fields=classification,code
quarkus.smallrye-graphql.show-runtime-exception-message=com.restaurantemarketplace.restaurant.RestaurantBusinessException,com.restaurantemarketplace.identity.IdentityBusinessException
%prod.quarkus.smallrye-graphql.schema-available=false
%prod.quarkus.smallrye-graphql.ui.enabled=false

# Desenvolvimento e testes não dependem de um coletor de telemetria.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
%dev.quarkus.observability.enabled=false

# O Keycloak fornece identidade e papéis globais. Vínculos por restaurante permanecem no banco da aplicação.
quarkus.oidc.application-type=service
quarkus.oidc.client-id=restaurante-marketplace-backend
quarkus.oidc.roles.role-claim-path=realm_access/roles
restaurant.security.authorization-enabled=true

# Em desenvolvimento, o Dev Services importa um realm local determinístico.
%dev.quarkus.keycloak.devservices.enabled=true
%dev.quarkus.keycloak.devservices.realm-name=restaurante-marketplace
%dev.quarkus.keycloak.devservices.realm-path=keycloak/restaurante-marketplace-realm.json
%dev.quarkus.keycloak.devservices.web-client-timeout=30S
%dev.quarkus.keycloak.devservices.disable-https=true
%dev.quarkus.oidc.devui.grant.type=password

# Os testes de domínio usam identidades simuladas para continuarem rápidos e isolados.
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.enabled=false

# Produção exporta telemetria para o Collector/Grafana Cloud via OTLP.
%prod.quarkus.otel.sdk.disabled=false
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}

# Configuração obrigatória do banco em produção.
%prod.quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL}
%prod.quarkus.datasource.username=${DATABASE_USERNAME}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}

# Realm externo utilizado pela aplicação publicada.
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:restaurante-marketplace-backend}

# Logs legíveis localmente e estruturados em produção.
%prod.quarkus.log.console.json.enabled=true
