quarkus.application.name=restaurante-marketplace-backend

# PostgreSQL e migrações
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Endpoints operacionais ficam separados da API pública.
quarkus.management.enabled=true
quarkus.management.port=9000

# Proteções iniciais para consultas GraphQL.
quarkus.smallrye-graphql.instrumentation-query-depth=15
quarkus.smallrye-graphql.instrumentation-query-complexity=200
%prod.quarkus.smallrye-graphql.schema-available=false
%prod.quarkus.smallrye-graphql.ui.enabled=false

# Desenvolvimento e testes não dependem de um coletor de telemetria.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
%dev.quarkus.observability.enabled=false

# O provedor de identidade será escolhido na etapa de autenticação.
%dev.quarkus.keycloak.devservices.enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%dev.quarkus.oidc.enabled=false
%test.quarkus.oidc.enabled=false

# Produção exporta telemetria para o Collector/Grafana Cloud via OTLP.
%prod.quarkus.otel.sdk.disabled=false
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}

# Configuração obrigatória do banco em produção.
%prod.quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL}
%prod.quarkus.datasource.username=${DATABASE_USERNAME}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}

# Logs legíveis localmente e estruturados em produção.
%prod.quarkus.log.console.json.enabled=true
